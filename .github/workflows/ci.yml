name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published Go vulnerabilities are caught even without new commits.
    - cron: "0 3 * * 1"

permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't).
# Dependabot keeps the pins current; the comment shows the version.

jobs:
  test:
    strategy:
      fail-fast: false # one OS failing should not cancel the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # stable = what releases are built with; go.mod = oldest supported Go
        go: [stable]
        include:
          - os: ubuntu-latest
            go: go.mod
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          cache: false # no dependencies to cache
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      # Config in .golangci.yml: staticcheck, errcheck, gosec and friends.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  zizmor:
    # Security linter for these workflow files: template injection,
    # over-broad permissions, unpinned actions, credential leaks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false # fail this job on findings instead of uploading
          annotations: true

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable # check the Go that releases are built with
          cache: false
      # Fails if code passgen actually calls has a known vulnerability
      # (in the Go standard library or any dependency).
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
