version: 2
updates:
  # Bumps the SHA-pinned actions in .github/workflows (and the version comments).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a hijacked
    # release is likely caught and pulled before it reaches us.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # passgen has no dependencies today; this covers any added later.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
